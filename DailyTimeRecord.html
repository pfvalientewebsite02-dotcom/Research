<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Daily Time Record</title>
  <style>
    body {
      background-color: rgba(245, 245, 243, 0.988);
      color: black;
      font-family: sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
    }

    header {
      background-color: #0e960e;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      flex-wrap: wrap;
      width: 100%;
      box-sizing: border-box;
    }

    header h1 {
      margin: 0;
      font-size: 1.8em;
      text-align: center;
    }

    .logo {
      width: 200px;
      height: auto;
      display: block;
    }

    h2 {
      text-align: center;
      color: rgb(20, 17, 17);
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande';
      font-size: 2em;
      font-style: italic;
      margin-top: 20px;
    }
    
    .header-content {
      margin: 20px 0;
      text-align: center;
    }

    input[type="file"] {
      margin-top: 15px;
    }

    #fileNameDisplay {
      font-style: italic;
      color: darkgreen;
      margin-top: 5px;
    }

    #imagePreview {
      display: none;
      max-width: 500px;
      max-height: 400px;
      border: 2px solid black;
      border-radius: 8px;
      margin: 20px auto;
    }

    .signature-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 30px;
    }

    .signature-box {
      background: white;
      border: 1px solid black;
      border-radius: 5px;
      padding: 10px;
      width: 300px;
      height: 180px;
      position: relative;
    }

    .signature-label {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }

    canvas {
      border: 1px solid #ccc;
      border-radius: 5px;
      width: 100%;
      height: 100px;
      cursor: crosshair;
    }

    button {
      padding: 8px 15px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    .buttons {
      text-align: center;
      margin-top: 20px;
    }

    footer {
      background-color: #e4e70d;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
      margin-top: auto;
    }

    /* Responsive */
    @media (max-width: 992px) {
      header {
        flex-direction: column;
        text-align: center;
      }

      .logo {
        margin: 10px auto;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <img src="logoacademyremove.png" class="logo" alt="Academy Logo">
    <h1>Tayabas Western Academy</h1>
  </header>

  <!-- Main Content -->
  <div class="header-content">
    <p><b>Attached signed Daily Time Record (DTR)</b></p>
    <h2>ATTENDANCE SHEET</h2>
  </div>

  <form id="dtrForm" class="header-content">
    <input type="file" id="dtrFile" accept="image/*" required>
    <p id="fileNameDisplay"></p>
    <img id="imagePreview" alt="DTR Preview">
  </form>

  <div class="signature-container">
    <div class="signature-box">
      <canvas id="studentSignature"></canvas>
      <div class="signature-label">Student-Trainee Signature</div>
      <button type="button" id="clearStudent">Clear</button>
    </div>

    <div class="signature-box">
      <canvas id="teacherSignature"></canvas>
      <div class="signature-label">Work Immersion Teacher</div>
      <button type="button" id="clearTeacher">Clear</button>
    </div>

    <div class="signature-box">
      <canvas id="supervisorSignature"></canvas>
      <div class="signature-label">Partner Institution Supervisor</div>
      <button type="button" id="clearSupervisor">Clear</button>
    </div>
  </div>

  <div class="buttons">
    <button type="button" id="clearFormBtn">Clear Form</button>
    <button type="button" id="nextBtn">Next</button>
  </div>

  <!-- Footer -->
  <footer>
    © 2025 Tayabas Western Academy. All rights reserved. | Contact: info@yourschool.edu.ph.
    <p>SENIOR HIGH | WORK IMMERSION PROGRAM</p>
  </footer>

  <!-- Signature Pad Library -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <script>
    const STORAGE_KEY = "workImmersionAllFormData";

    const dtrFile = document.getElementById("dtrFile");
    const fileNameDisplay = document.getElementById("fileNameDisplay");
    const imagePreview = document.getElementById("imagePreview");

    const studentSignaturePad = new SignaturePad(document.getElementById("studentSignature"));
    const teacherSignaturePad = new SignaturePad(document.getElementById("teacherSignature"));
    const supervisorSignaturePad = new SignaturePad(document.getElementById("supervisorSignature"));

    // Load saved data
    window.addEventListener("load", () => {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      if (data.dtrFileName) {
        fileNameDisplay.textContent = "Previously selected file: " + data.dtrFileName;
      }
      if (data.dtrFileData) {
        imagePreview.src = data.dtrFileData;
        imagePreview.style.display = "block";
      }
      if (data.studentSignature) studentSignaturePad.fromDataURL(data.studentSignature);
      if (data.teacherSignature) teacherSignaturePad.fromDataURL(data.teacherSignature);
      if (data.supervisorSignature) supervisorSignaturePad.fromDataURL(data.supervisorSignature);
    });

    // File input
    dtrFile.addEventListener("change", () => {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      if (dtrFile.files.length > 0) {
        const file = dtrFile.files[0];
        data.dtrFileName = file.name;

        const reader = new FileReader();
        reader.onload = function(e) {
          imagePreview.src = e.target.result;
          imagePreview.style.display = "block";
          data.dtrFileData = e.target.result;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        };
        reader.readAsDataURL(file);

        fileNameDisplay.textContent = "Selected file: " + file.name;
      } else {
        fileNameDisplay.textContent = "";
        imagePreview.src = "";
        imagePreview.style.display = "none";
        delete data.dtrFileName;
        delete data.dtrFileData;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }
    });

    // Save signatures
    function saveSignatures() {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      data.studentSignature = studentSignaturePad.isEmpty() ? null : studentSignaturePad.toDataURL();
      data.teacherSignature = teacherSignaturePad.isEmpty() ? null : teacherSignaturePad.toDataURL();
      data.supervisorSignature = supervisorSignaturePad.isEmpty() ? null : supervisorSignaturePad.toDataURL();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    [studentSignaturePad, teacherSignaturePad, supervisorSignaturePad].forEach(pad => {
      pad.onEnd = saveSignatures;
    });

    // Clear individual signatures
    document.getElementById("clearStudent").addEventListener("click", () => { studentSignaturePad.clear(); saveSignatures(); });
    document.getElementById("clearTeacher").addEventListener("click", () => { teacherSignaturePad.clear(); saveSignatures(); });
    document.getElementById("clearSupervisor").addEventListener("click", () => { supervisorSignaturePad.clear(); saveSignatures(); });

    // Clear whole form
    document.getElementById("clearFormBtn").addEventListener("click", () => {
      document.getElementById("dtrForm").reset();
      studentSignaturePad.clear();
      teacherSignaturePad.clear();
      supervisorSignaturePad.clear();
      fileNameDisplay.textContent = "";
      imagePreview.src = "";
      imagePreview.style.display = "none";
      localStorage.removeItem(STORAGE_KEY);
    });

    // Next button
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (!dtrFile.checkValidity()) {
        alert("Please attach your Daily Time Record (DTR) file before proceeding.");
        return;
      }
      if (studentSignaturePad.isEmpty() || teacherSignaturePad.isEmpty() || supervisorSignaturePad.isEmpty()) {
        alert("Please provide all required signatures before proceeding.");
        return;
      }
      window.location.href = "workimmersionreport1.html";
    });
  </script>
</body>
</html>
