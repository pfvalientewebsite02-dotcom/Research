<!DOCTYPE html>
<html> 
<head>
  <meta charset="UTF-8">
  <title>Company Flowchart</title>
  <style>
    body {
      background-color: rgba(250, 250, 247, 0.973);
      color: black;
      font-family: sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
    }

    header {
      background-color: #0e960e;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      flex-wrap: wrap;
      width: 100%;
      box-sizing: border-box;
    }

    header h1 {
      margin: 0;
      font-size: 1.8em;
      text-align: center;
    }

    .logo {
      width: 200px;
      height: auto;
      display: block;
    }

    h2 {
      text-align: center;
      color: rgb(20, 17, 17);
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande';
      font-size: 2em;
      font-style: italic;
      margin-top: 20px;
    }

    .header-content {
      margin: 20px 0;
      text-align: center;
    }

    input[type="file"] {
      margin-top: 15px;
    }

    #fileNameDisplay {
      font-style: italic;
      color: darkgreen;
      margin-top: 5px;
    }

    #imagePreview {
      display: none;
      max-width: 500px;
      max-height: 400px;
      border: 2px solid black;
      border-radius: 8px;
      margin: 20px auto;
    }

    .buttons {
      text-align: center;
      margin-top: 20px;
    }

    button {
      padding: 8px 15px;
      font-weight: bold;
      margin: 10px;
      cursor: pointer;
    }

      section {
      width: 90%;
      max-width: 1000px;
      background-color: rgb(250, 244, 244);
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 40px;
      box-sizing: border-box;
      margin: 20px 0;
      text-align: left;
    }

    footer {
      background-color: #e4e70d;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
      margin-top: auto;
    }

    /* Responsive */
    @media (max-width: 992px) {
      header {
        flex-direction: column;
        text-align: center;
      }
      .logo {
        margin: 10px auto;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <img src="logoacademyremove.png" class="logo" alt="Academy Logo">
    <h1>Tayabas Western Academy</h1>
  </header>

  <section>
  <!-- Main Content -->
  <div class="header-content">
    <p><b>Draw a diagram or insert the picture of the company or institution's business flow chart</b></p>
    <h2>THE COMPANY</h2>

    <form id="flowchartForm">
      <input type="file" id="fileUpload" name="fileUpload" accept="image/*" required>
      <p id="fileNameDisplay"></p>
      <img id="imagePreview" alt="Flowchart Preview">

      <div class="buttons">
        <button type="button" id="clearBtn">Clear Form</button>
        <button type="button" id="nextBtn">Next</button>
      </div>
    </form>
  </div>
  </section>

  <!-- Footer -->
  <footer>
    © 2025 Tayabas Western Academy. All rights reserved. | Contact: info@yourschool.edu.ph.
    <p>SENIOR HIGH | WORK IMMERSION PROGRAM</p>
  </footer>

  <script>
    const fileInput = document.getElementById("fileUpload");
    const fileNameDisplay = document.getElementById("fileNameDisplay");
    const imagePreview = document.getElementById("imagePreview");
    const form = document.getElementById("flowchartForm");
    const STORAGE_KEY = "workImmersionAllFormData";

    // Load saved file
    window.addEventListener("load", () => {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      if (data.fileUploadName) {
        fileNameDisplay.textContent = "Previously selected file: " + data.fileUploadName;
      }
      if (data.fileUploadData) {
        imagePreview.src = data.fileUploadData;
        imagePreview.style.display = "block";
      }
    });

    // File input change
    fileInput.addEventListener("change", () => {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        data.fileUploadName = file.name;
        fileNameDisplay.textContent = "Selected file: " + file.name;

        const reader = new FileReader();
        reader.onload = function(e) {
          imagePreview.src = e.target.result;
          imagePreview.style.display = "block";
          data.fileUploadData = e.target.result;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        };
        reader.readAsDataURL(file);
      } else {
        fileNameDisplay.textContent = "";
        imagePreview.src = "";
        imagePreview.style.display = "none";
        delete data.fileUploadName;
        delete data.fileUploadData;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }
    });

    // Clear form
    document.getElementById("clearBtn").addEventListener("click", () => {
      form.reset();
      fileNameDisplay.textContent = "";
      imagePreview.src = "";
      imagePreview.style.display = "none";
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      delete data.fileUploadName;
      delete data.fileUploadData;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    });

    // Next button
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (!fileInput.checkValidity()) {
        form.reportValidity();
        return;
      }
      window.location.href = "DailyTimeRecord.html"; // Page 3
    });
  </script>
</body>
</html>
