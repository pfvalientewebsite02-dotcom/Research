<!DOCTYPE html>
<html> 
<head>
<title>MY REFLECTIONS</title>
<style type="text/css">
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center; /* Center everything horizontally */
      min-height: 100vh;
    }
    
    header {
      background-color: #0e960e;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      flex-wrap: wrap;
      width: 100%;
      box-sizing: border-box;
    }

    .logo {
      width: 200px;
      height: 100px;
      display: block;
    }

    section {
      width: 90%;
      max-width: 1000px;
      background-color: rgb(250, 244, 244);
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 40px;
      box-sizing: border-box;
      margin: 20px 0;
      text-align: left;
    }

    h2 {
      text-align: center;
      color: #06402b;
      font-family: 'Lucida Sans', Geneva, Verdana, sans-serif;
      font-size: 2em;
      font-style: italic;
    }

    /* Form buttons */
    .buttons {
      margin-top: 20px;
      text-align: center;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      border: none;
      background-color: #0e960e;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #0b7a0b;
    }

    /* Image Preview - framed and centered */
    #preview {
      margin: 15px auto 0;
      max-width: 400px;
      display: none;
      border: 5px solid #333;
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      background-color: white;
      box-sizing: content-box;
      display: block;
    }
     /* ✅ Mobile / Tablet behavior */
    @media (max-width: 992px) {
      main {
        align-items: flex-start; /* No vertical centering on small screens */
        padding: 20px;
      }
      section {
        padding: 20px;
        margin-top: 20px;
      }
      header {
        flex-direction: column;
        text-align: center;
      }
      .logo {
        margin: 10px auto;
      }
    }
    footer {
      background-color: #e4e70d;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
      margin-top: auto;
    }
</style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logoacademyremove.png" class="logo" alt="Academy Logo">
        </div>
        <h1>Tayabas Western Academy</h1>
    </header>

    <section> 
        <h2>THE COMPANY</h2>

        <form id="reflectionForm">
            <p><b>Attach or draw the organizational chart of the office or establishment you are assigned for work immersion</b></p>
            <input type="file" id="orgChart" name="orgChart" accept="image/*" required/><br />

            <!-- Image preview -->
            <img id="preview" alt="Image Preview" />

            <!-- Centered buttons -->
            <div class="buttons">
                <button type="button" id="clearBtn">Clear Form</button>
                <button type="button" id="nextBtn">Next</button>
            </div>
        </form>
    </section>
         
    <footer>
        © 2025 Tayabas Western Academy. All rights reserved. | Contact: info@yourschool.edu.ph.
        <p>SENIOR HIGH</p>
        <p>WORK IMMERSION PROGRAM</p>
    </footer>

    <script>
        const form = document.getElementById('reflectionForm');
        const STORAGE_KEY = "workImmersionAllFormData";
        const orgChartInput = document.getElementById('orgChart');
        const preview = document.getElementById('preview');

        // Load saved data except file inputs
        window.addEventListener('load', () => {
            const savedData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            for (const [key, value] of Object.entries(savedData)) {
                const field = form.elements[key];
                if (field && field.type !== 'file') {
                    field.value = value;
                }
            }
        });

        // Auto-save non-file input changes
        form.addEventListener('input', (e) => {
            if (e.target.type === 'file') return; // skip file inputs
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            data[e.target.name] = e.target.value;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        });

        // Show image preview when a file is selected
        orgChartInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                preview.src = '';
                preview.style.display = 'none';
            }
        });

        // Clear form and localStorage key
        document.getElementById('clearBtn').addEventListener('click', () => {
            form.reset();
            localStorage.removeItem(STORAGE_KEY);
            preview.src = '';
            preview.style.display = 'none';
        });

        // Next button click: validate form then go to next page
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            window.location.href = 'ACTIVITY3and4THECOMPANY.html';
        });
    </script>
</body>
</html>
