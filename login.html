<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <title>Login - TVL/ICT Attendance Tracker</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  position: relative;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  text-align: center;
  overflow-x: hidden;
}

/* ✅ Background with blur + overlay */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
    url('twalogonew.png') center/cover no-repeat;
  filter: blur(4px);
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.3);
  z-index: -1;
}

/* Header animation */
.header-content {
  margin-bottom: 30px;
  opacity: 0;
  transform: translateY(-30px);
  animation: fadeHeader 1.2s ease-out forwards;
}

@keyframes fadeHeader {
  from {
    opacity: 0;
    transform: translateY(-30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.header-content h1 {
  font-size: 2em;
  font-weight: 600;
  margin-bottom: 10px;
  letter-spacing: 1px;
  text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
}

.header-content img {
  width: 150px;
  border-radius: 50%;
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
  transition: transform 0.6s ease;
  animation: floatLogo 2.5s ease-in-out 1.2s infinite alternate;
}

@keyframes floatLogo {
  from { transform: translateY(0); }
  to { transform: translateY(-8px); }
}

/* ✅ Frosted Glass Login Box */
.login-box {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(15px) saturate(160%);
  -webkit-backdrop-filter: blur(15px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 20px;
  padding: 45px 35px;
  width: 90%;
  max-width: 400px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
  text-align: center;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeInUp 1s ease-out 1.3s forwards;
}

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.login-box h2 {
  margin-bottom: 25px;
  font-weight: 600;
  color: #ffffff;
}

/* Input fields */
.input-field {
  position: relative;
  margin-bottom: 20px;
}

.input-field input {
  width: 100%;
  padding: 12px 15px 12px 45px;
  border: none;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.85);
  color: #333;
  outline: none;
  font-size: 16px;
  transition: all 0.3s ease-in-out;
}

.input-field input:focus {
  border: 2px solid #57e017;
  transform: scale(1.02);
  box-shadow: 0 4px 8px rgba(87, 224, 23, 0.2);
}

.input-field img {
  position: absolute;
  top: 50%;
  left: 12px;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  opacity: 0.8;
  filter: invert(50%);
}

.input-field input::placeholder {
  color: #888;
}

/* Login button */
.login-box button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(to right, #57e017, #d7ae46);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
}

.login-box button:hover {
  background: linear-gradient(to right, #42ed95, #31bfd8);
  transform: scale(1.05);
  box-shadow: 0 4px 12px rgba(66, 237, 149, 0.4);
}

.login-box button:active {
  transform: scale(0.98);
}

/* Mobile adjustments */
@media (max-width: 480px) {
  body {
    justify-content: flex-start;
    padding: 40px 0;
    background-attachment: scroll;
  }

  .header-content img {
    width: 110px;
  }

  .login-box {
    padding: 30px 20px;
  }
}
  </style>
</head>
<body>

  <div class="header-content">
    <img src="logoacademyremove.png" alt="logoacademyremove">
    <h1>Work Immersion</h1>
  </div>

  <div class="login-box">
    <h2>Login</h2>

    <div class="input-field">
      <img src="https://cdn-icons-png.flaticon.com/512/747/747376.png" alt="user icon">
      <input type="text" id="username" placeholder="Username" required>
    </div>

    <div class="input-field">
      <img src="https://cdn-icons-png.flaticon.com/512/3064/3064155.png" alt="lock icon">
      <input type="password" id="password" placeholder="Password" required>
    </div>

    <button onclick="login()">Login</button>
  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (username === "Group15" && password === "1928") {
        window.location.href = "TableOfContents.html";
      } else {
        alert("Invalid login. Wag kang hacker.");
      }
    }
  </script>

</body>
</html>
