<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now Button</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: hwb(240 37% 1%);
        }
        .apply-button {
            background-color: #2edb0b;
            color: white;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .apply-button:hover {
            background-color: #e9aa21;
        }
    </style>
</head>
<body>

    <a href="mailto:mangahoon223@gmail.com?subject=Application&body=I would like to apply for the position." class="apply-button">Apply Now</a>

</body>
</html>
