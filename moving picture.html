<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Picture Interface</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Prevent scrollbars */
            background-color: hwb(169 37% 1%);
        }
        #movingImage {
            position: absolute;
            width: 300px; /* Set the width of the image */
            height: auto; /* Maintain aspect ratio */
        }
    </style>
</head>
<body>

<img id="movingImage" src="logoacademyremove.png" alt="Moving Picture">

<script>
    const image = document.getElementById('movingImage');
    let position = 0;
    const speed = 2; // Speed of the movement in pixels

    function moveImage() {
        position += speed;
        image.style.left = position + 'px';

        // Reset position when it goes off screen
        if (position > window.innerWidth) {
            position = -100; // Reset to start from the left
        }

        requestAnimationFrame(moveImage);
    }

    moveImage(); // Start the animation
</script>

</body>
</html>
