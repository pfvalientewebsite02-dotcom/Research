<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Portfolio System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    margin: 0;
}

header {
    background-color: #2c3e50;
    color: white;
    padding: 20px;
    text-align: center;
}

section {
    max-width: 900px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 8px;
    animation: fadeIn 0.4s ease-in;
}

input, textarea, button, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    font-size: 16px;
}

button {
    border: none;
    cursor: pointer;
}

.submit-btn { background: #3498db; color: white; }
.edit-btn { background: #f39c12; color: white; }
.delete-btn { background: #e74c3c; color: white; }

.portfolio-item {
    border-bottom: 1px solid #ddd;
    padding: 15px 0;
}

.student-name {
    font-weight: bold;
    color: #2c3e50;
}

.actions button {
    width: auto;
    padding: 6px 12px;
    margin-right: 5px;
}

.teacher-note {
    font-style: italic;
    color: #555;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
</style>
</head>

<body>

<header>
<h1>Student Portfolio System</h1>
<p>Student Submission and Teacher Monitoring</p>
</header>

<!-- VIEW SELECTION -->
<section>
<label><strong>Select View:</strong></label>
<select id="viewMode" onchange="toggleView()">
    <option value="student">Student View</option>
    <option value="teacher">Teacher View</option>
</select>
</section>

<!-- STUDENT FORM -->
<section id="formSection">
<h2>Submit Project (Student)</h2>
<form id="portfolioForm">
    <input type="text" id="studentName" placeholder="Student Name" required>
    <input type="text" id="title" placeholder="Project Title" required>
    <textarea id="description" placeholder="Project Description" required></textarea>
    <input type="file" id="pdfFile" accept="application/pdf">
    <button type="submit" class="submit-btn">Submit</button>
</form>
</section>

<!-- PORTFOLIO DISPLAY -->
<section>
<h2>Portfolio Entries</h2>

<p id="teacherNote" class="teacher-note" style="display:none;">
Teacher View: Read-only access
</p>

<div id="portfolioList"></div>
</section>

<script>
const form = document.getElementById("portfolioForm");
const portfolioList = document.getElementById("portfolioList");
const formSection = document.getElementById("formSection");
const teacherNote = document.getElementById("teacherNote");
const viewModeSelect = document.getElementById("viewMode");

let portfolio = JSON.parse(localStorage.getItem("portfolio")) || [];
let editIndex = null;
let isTeacherView = false;

function displayPortfolio() {
    portfolioList.innerHTML = "";

    portfolio.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "portfolio-item";

        div.innerHTML = `
            <p class="student-name">Student: ${item.student}</p>
            <h3>${item.title}</h3>
            <p>${item.description}</p>
            ${item.pdf ? `<a href="${item.pdf}" target="_blank">View PDF</a>` : ""}
            ${
                !isTeacherView
                ? `<div class="actions">
                    <button class="edit-btn" onclick="editEntry(${index})">Edit</button>
                    <button class="delete-btn" onclick="deleteEntry(${index})">Delete</button>
                  </div>`
                : ""
            }
        `;
        portfolioList.appendChild(div);
    });
}

form.addEventListener("submit", function(e) {
    e.preventDefault();

    const file = pdfFile.files[0];

    if (file) {
        const reader = new FileReader();
        reader.onload = () => saveEntry(reader.result);
        reader.readAsDataURL(file);
    } else {
        saveEntry(null);
    }
});

function saveEntry(pdfData) {
    const entry = {
        student: studentName.value,
        title: title.value,
        description: description.value,
        pdf: pdfData
    };

    if (editIndex === null) {
        portfolio.push(entry);
    } else {
        portfolio[editIndex] = entry;
        editIndex = null;
    }

    localStorage.setItem("portfolio", JSON.stringify(portfolio));
    form.reset();
    displayPortfolio();
}

function deleteEntry(index) {
    if (confirm("Delete this entry?")) {
        portfolio.splice(index, 1);
        localStorage.setItem("portfolio", JSON.stringify(portfolio));
        displayPortfolio();
    }
}

function editEntry(index) {
    const item = portfolio[index];
    studentName.value = item.student;
    title.value = item.title;
    description.value = item.description;
    editIndex = index;
}

function toggleView() {
    isTeacherView = viewModeSelect.value === "teacher";

    if (isTeacherView) {
        formSection.style.display = "none";
        teacherNote.style.display = "block";
    } else {
        formSection.style.display = "block";
        teacherNote.style.display = "none";
    }

    displayPortfolio();
}

displayPortfolio();
</script>

</body>
</html>
