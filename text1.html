<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Resume Page</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- custom css -->
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <nav class="navbar bg-green">
        <div class="container">
            <div class="navbar-content">
                <div class="brand-and-toggler">
                    <a href="index.html" class="navbar-brand">
                        <img src="curriculum-vitae.png" alt="" class="navbar-brand-icon">
                        <span class="navbar-brand-text">build <span>resume.</span></span>
                    </a>
                    <button type="button" class="navbar-toggler-btn">
                        <div class="bars">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <section id="about-sc">
        <div class="container">
            <div class="about-cnt">
                <form action="" class="cv-form" id="cv-form">
                    <!-- ===== ABOUT SECTION ===== -->
                    <div class="cv-form-blk">
                        <div class="cv-form-row-title">
                            <h3>about section</h3>
                        </div>
                        <div class="cv-form-row cv-form-row-about">
                            <div class="cols-3">
                                <div class="form-elem">
                                    <label class="form-label">First Name</label>
                                    <input name="firstname" type="text" class="form-control firstname" onkeyup="generateCV()" placeholder="e.g. Alex">
                                </div>
                                <div class="form-elem">
                                    <label class="form-label">Middle Name <span class="opt-text">(optional)</span></label>
                                    <input name="middlename" type="text" class="form-control middlename" onkeyup="generateCV()" placeholder="e.g. NONE">
                                </div>
                                <div class="form-elem">
                                    <label class="form-label">Last Name</label>
                                    <input name="lastname" type="text" class="form-control lastname" onkeyup="generateCV()" placeholder="e.g. Consani">
                                </div>
                            </div>

                            <div class="cols-3">
                                <div class="form-elem">
                                    <label class="form-label">Your Image</label>
                                    <input name="image" type="file" class="form-control image" accept="image/*" onchange="previewImage(event)">
                                </div>
                                <div class="form-elem">
                                    <label class="form-label">Strand</label>
                                    <input name="designation" type="text" class="form-control designation" onkeyup="generateCV()" placeholder="e.g. TVL-ICT">
                                </div>
                                <div class="form-elem">
                                    <label class="form-label">Address</label>
                                    <input name="address" type="text" class="form-control address" onkeyup="generateCV()" placeholder="e.g. 626 Nadres St.">
                                </div>
                            </div>

                            <div class="cols-3">
                                <div class="form-elem">
                                    <label class="form-label">Email</label>
                                    <input name="email" type="text" class="form-control email" onkeyup="generateCV()" placeholder="e.g. ryanalblushi@gmail.com">
                                </div>
                                <div class="form-elem">
                                    <label class="form-label">Phone No:</label>
                                    <input name="phoneno" type="text" class="form-control phoneno" onkeyup="generateCV()" placeholder="e.g. 09812479982">
                                </div>
                                <div class="form-elem">
                                    <label class="form-label">Objective</label>
                                    <input name="summary" type="text" class="form-control summary" onkeyup="generateCV()" placeholder="e.g. Yes">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ===== ACHIEVEMENTS ===== -->
                    <div class="cv-form-blk">
                        <div class="cv-form-row-title">
                            <h3>achievement/s</h3>
                        </div>
                        <div class="row-separator repeater">
                            <div class="repeater" data-repeater-list="group-a">
                                <div data-repeater-item>
                                    <div class="cv-form-row cv-form-row-achievement">
                                        <div class="cols-2">
                                            <div class="form-elem">
                                                <label class="form-label">Title</label>
                                                <input name="achieve_title" type="text" class="form-control achieve_title" onkeyup="generateCV()" placeholder="e.g. Honor Student">
                                            </div>
                                            <div class="form-elem">
                                                <label class="form-label">Description</label>
                                                <input name="achieve_description" type="text" class="form-control achieve_description" onkeyup="generateCV()" placeholder="e.g. TWA , Grade Level, A.Y. 2024-2025">
                                            </div>
                                        </div>
                                        <button data-repeater-delete type="button" class="repeater-remove-btn">-</button>
                                    </div>
                                </div>
                            </div>
                            <button type="button" data-repeater-create class="repeater-add-btn">+</button>
                        </div>
                    </div>

                    <!-- Repeat for Experiences, Education, Character References, Skills... -->
                    <!-- (I’m keeping your original structure for those to save space here) -->

                </form>
            </div>
        </div>
    </section>

    <!-- ===== PREVIEW SECTION ===== -->
    <section id="preview-sc" class="print_area">
        <div class="container">
            <div class="preview-cnt">
                <div class="preview-cnt-l bg-green text-white">
                    <div class="preview-blk">
                        <div class="preview-image">
                            <img src="" alt="" id="image_dsp"> 
                        </div>
                        <div class="preview-item preview-item-name">
                            <span class="preview-item-val fw-6" id="fullname_dsp"></span>
                        </div>
                        <div class="preview-item">
                            <span class="preview-item-val text-uppercase fw-6 ls-1" id="designation_dsp"></span>
                        </div>
                    </div>
                    <div class="preview-blk">
                        <div class="preview-blk-title"><h3>about</h3></div>
                        <div class="preview-blk-list">
                            <div class="preview-item"><span id="phoneno_dsp"></span></div>
                            <div class="preview-item"><span id="email_dsp"></span></div>
                            <div class="preview-item"><span id="address_dsp"></span></div>
                            <div class="preview-item"><span id="summary_dsp"></span></div>
                        </div>
                    </div>
                    <div class="preview-blk">
                        <div class="preview-blk-title"><h3>skills</h3></div>
                        <div class="skills-items preview-blk-list" id="skills_dsp"></div>
                    </div>
                </div>
                <div class="preview-cnt-r bg-white">
                    <div class="preview-blk">
                        <div class="preview-blk-title"><h3>Achievement/s</h3></div>
                        <div class="achievements-items preview-blk-list" id="achievements_dsp"></div>
                    </div>
                    <div class="preview-blk">
                        <div class="preview-blk-title"><h3>education</h3></div>
                        <div class="educations-items preview-blk-list" id="educations_dsp"></div>
                    </div>
                    <div class="preview-blk">
                        <div class="preview-blk-title"><h3>experience/s</h3></div>
                        <div class="experiences-items preview-blk-list" id="experiences_dsp"></div>
                    </div>
                    <div class="preview-blk">
                        <div class="preview-blk-title"><h3>Character Reference/s</h3></div>
                        <div class="projects-items preview-blk-list" id="projects_dsp"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== PRINT BUTTON ===== -->
    <section class="print-btn-sc">
        <div class="container">
            <button type="button" class="print-btn btn btn-primary" onclick="printCV()">Print CV</button>
            <button type="button" onclick="clearCVData()">Clear Saved Data</button>
        </div>
    </section>

    <!-- jquery cdn -->
    <script src="https://code.jquery.com/jquery-3.6.4.js"></script>
    <!-- jquery repeater cdn -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.repeater/1.2.1/jquery.repeater.js"></script>
    <!-- custom js -->
    <script src="script.js"></script>
    <!-- app js -->
    <script src="app.js"></script>

    <!-- ===== SAVE SYSTEM SCRIPT ===== -->
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("cv-form");

        // Load saved data
        loadFormData();

        // Save text input changes
        form.addEventListener("input", saveFormData);

        // Save image upload
        document.querySelector('input[name="image"]').addEventListener("change", function (event) {
            const reader = new FileReader();
            reader.onload = function () {
                localStorage.setItem("cvProfileImage", reader.result);
                document.getElementById("image_dsp").src = reader.result;
            };
            reader.readAsDataURL(event.target.files[0]);
        });

        function saveFormData() {
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });
            localStorage.setItem("cvFormData", JSON.stringify(data));
        }

        function loadFormData() {
            const savedData = localStorage.getItem("cvFormData");
            if (savedData) {
                const data = JSON.parse(savedData);
                for (const key in data) {
                    const input = form.querySelector(`[name="${key}"]`);
                    if (input) {
                        input.value = data[key];
                    }
                }
            }
            const savedImage = localStorage.getItem("cvProfileImage");
            if (savedImage) {
                document.getElementById("image_dsp").src = savedImage;
            }
            if (typeof generateCV === "function") {
                generateCV();
            }
        }

        window.clearCVData = function () {
            localStorage.removeItem("cvFormData");
            localStorage.removeItem("cvProfileImage");
            form.reset();
            document.getElementById("image_dsp").src = "";
            if (typeof generateCV === "function") {
                generateCV();
            }
        }
    });
    </script>

    <footer style="text-align: center; margin-top: 20px;">
        <p>SENIOR HIGH WORK IMMERSION PROGRAM</p>
    </footer>
</body>
</html>
