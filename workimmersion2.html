<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Work Immersion Report - Other Tasks</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    align-items: center;
  }

  header {
    background-color: #0e960e;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    flex-wrap: wrap;
    width: 100%;
    box-sizing: border-box;
  }

  header h1 {
    margin: 0;
    font-size: 1.8em;
    text-align: center;
  }

  .logo {
    width: 200px;
    height: auto;
  }

  section {
    width: 90%;
    max-width: 900px;
    background-color: #fff;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    padding: 20px;
    margin: 20px auto;
    box-sizing: border-box;
  }

  h2 {
    text-align: center;
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande';
    font-size: 2em;
    font-style: italic;
    margin-top: 0;
  }

  label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    margin-top: 10px;
    margin-bottom: 10px;
    padding: 10px;
    font-size: 1em;
    resize: vertical;
  }

  input[type="file"] {
    margin-top: 10px;
  }

  #imagePreview {
    display: none;
    max-width: 500px;
    max-height: 400px;
    margin: 15px auto;
    border: 2px solid black;
    border-radius: 8px;
    display: block;
  }

  .buttons {
    text-align: center;
    margin-top: 20px;
  }

  button {
    padding: 10px 20px;
    font-weight: bold;
    margin: 10px;
    cursor: pointer;
    border-radius: 5px;
    border: none;
  }

  #clearBtn {
    background-color: #b33a3a;
    color: white;
  }

  #clearBtn:hover {
    background-color: #8c2e2e;
  }

  #nextBtn {
    background-color: #2e7d35;
    color: white;
  }

  #nextBtn:hover {
    background-color: #276c30;
  }

  #fileNameDisplay {
    text-align: center;
    font-style: italic;
    color: darkgreen;
    margin-top: 5px;
  }

  #errorMsg {
    color: red;
    font-weight: bold;
    margin-top: 10px;
    text-align: center;
  }

  footer {
    background-color: #e4e70d;
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 14px;
    width: 100%;
    box-sizing: border-box;
    margin-top: auto;
  }

  @media (max-width: 992px) {
    header {
      flex-direction: column;
      text-align: center;
    }

    .logo {
      margin: 10px auto;
    }
  }
</style>
</head>
<body>

<header>
  <img src="logoacademyremove.png" class="logo" alt="Academy Logo">
  <h1>Tayabas Western Academy</h1>
</header>

<section>
  <h2>ACTIVITY 2: Other-Related Task</h2>
  <p>Other related task mean taking on tasks outside your role but is based on the company given competencies to the students</p>
  <p>Attach or write an account of other related tasks,</p>

  <form id="reportForm" novalidate>
    <label for="taskTextarea">Task Description:</label>
    <textarea id="taskTextarea" name="task" rows="15" placeholder="Write your task here..." required></textarea>

    <label for="taskFile">Attach or insert a picture/file:</label>
    <input type="file" id="taskFile" name="taskFile" accept="image/*">
    <p id="fileNameDisplay"></p>

    <img id="imagePreview" alt="Attached Image Preview">

    <div id="errorMsg"></div>

    <div class="buttons">
      <button type="button" id="clearBtn">Clear Form</button>
      <button type="button" id="nextBtn">Next</button>
    </div>
  </form>
</section>

<footer>
  SENIOR HIGH WORK IMMERSION PROGRAM | © 2025 Tayabas Western Academy
</footer>

<script>
  const STORAGE_KEY = "workImmersionOtherTaskData";
  const textarea = document.getElementById("taskTextarea");
  const taskFile = document.getElementById("taskFile");
  const imagePreview = document.getElementById("imagePreview");
  const fileNameDisplay = document.getElementById("fileNameDisplay");
  const errorMsg = document.getElementById("errorMsg");

  // Load saved data
  window.addEventListener("load", () => {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    if (saved.task) textarea.value = saved.task;
    if (saved.taskFileName) {
      fileNameDisplay.textContent = "Previously selected file: " + saved.taskFileName;
    }
    if (saved.taskFileData) {
      imagePreview.src = saved.taskFileData;
      imagePreview.style.display = "block";
    }
  });

  // Auto-save task
  textarea.addEventListener("input", () => {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    data.task = textarea.value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  });

  // Show image preview + save filename
  taskFile.addEventListener("change", () => {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    if (taskFile.files.length > 0) {
      const file = taskFile.files[0];
      data.taskFileName = file.name;
      fileNameDisplay.textContent = "Selected file: " + file.name;

      const reader = new FileReader();
      reader.onload = function(e) {
        data.taskFileData = e.target.result;
        imagePreview.src = e.target.result;
        imagePreview.style.display = "block";
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      };
      reader.readAsDataURL(file);
    } else {
      delete data.taskFileName;
      delete data.taskFileData;
      fileNameDisplay.textContent = "";
      imagePreview.src = "";
      imagePreview.style.display = "none";
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
  });

  // Clear form
  document.getElementById("clearBtn").addEventListener("click", () => {
    textarea.value = "";
    taskFile.value = "";
    imagePreview.src = "";
    imagePreview.style.display = "none";
    fileNameDisplay.textContent = "";
    errorMsg.textContent = "";
    localStorage.removeItem(STORAGE_KEY);
  });

  // Next button
  document.getElementById("nextBtn").addEventListener("click", () => {
    if (!textarea.value.trim()) {
      errorMsg.textContent = "Please fill out the required task before proceeding.";
      return;
    }
    errorMsg.textContent = "";
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    data.task = textarea.value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    window.location.href = "workimmersionreportDAY1.html"; // Adjust next page
  });
</script>

</body>
</html>
