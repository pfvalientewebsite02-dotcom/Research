<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Work Immersion Report - Day 10</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    background-color: #0e960e;
    color: white;
    width: 100%;
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
  }

  header h1 {
    font-size: 1.8em;
    margin: 0;
  }

  .logo {
    width: 150px;
    height: auto;
  }

  section {
    width: 90%;
    max-width: 1000px;
    background-color: #fff8b0;
    padding: 20px;
    margin: 20px 0;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    box-sizing: border-box;
  }

  h2 {
    text-align: center;
    color: #317d2e;
    font-style: italic;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
  }

  th, td {
    border: 1px solid #333;
    padding: 8px;
    text-align: left;
  }

  textarea, input[type="date"], input[type="time"] {
    width: 100%;
    box-sizing: border-box;
    margin-top: 5px;
    margin-bottom: 10px;
    padding: 5px;
    border-radius: 4px;
    border: 1px solid #333;
  }

  #imagePreview {
    max-width: 400px;
    max-height: 300px;
    display: none;
    margin: 10px auto;
    border: 2px solid #333;
    border-radius: 8px;
    background-color: white;
  }

  .buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
  }

  button {
    padding: 10px 20px;
    font-weight: bold;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    color: white;
  }

  .submit-btn {
    background-color: #0e960e;
  }

  .clear-btn {
    background-color: #b33a3a;
  }

  footer {
    background-color: #e4e70d;
    color: white;
    text-align: center;
    padding: 15px;
    width: 100%;
    box-sizing: border-box;
    margin-top: auto;
  }
</style>
</head>

<body>

<header>
  <h1>Tayabas Western Academy</h1>
  <img src="logoacademyremove.png" alt="Academy Logo" class="logo">
</header>

<section>
  <h2>Activity 3: Daily Activity Report - Day 10</h2>

  <form id="dailyActivityForm" novalidate>
    <table>
      <tr><th>Student-Trainee</th><td><textarea name="student" required></textarea></td></tr>
      <tr><th>Strand</th><td><textarea name="strand" required></textarea></td></tr>
      <tr><th>Establishment Name</th><td><textarea name="establishment" required></textarea></td></tr>
      <tr><th>Address</th><td><textarea name="address" required></textarea></td></tr>
      <tr><th>Department Assigned</th><td><textarea name="department" required></textarea></td></tr>
      <tr><th>Area Head / Supervisor</th><td><textarea name="supervisor" required></textarea></td></tr>
    </table>

    <label>Date:</label>
    <input type="date" name="date" required>

    <label>Time:</label>
    <input type="time" name="time" required>

    <label>Activities Done:</label>
    <textarea name="activity1" required></textarea>
    <textarea name="activity2" required></textarea>

    <label>Supervisor Feedback:</label>
    <textarea name="feedback" required></textarea>

    <label>Attach Activity Picture:</label>
    <input type="file" id="activityPicture" accept="image/*">
    <img id="imagePreview">

    <label>Student Reflection:</label>
    <textarea name="reflection" required></textarea>

    <div class="buttons">
      <button type="button" class="clear-btn" id="clearBtn">Clear Form</button>
      <button type="button" class="submit-btn" id="pdfBtn">Download PDF</button>
      <button type="submit" class="submit-btn">Submit</button>
    </div>
  </form>
</section>

<footer>
  © 2025 Tayabas Western Academy | SENIOR HIGH WORK IMMERSION PROGRAM
</footer>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const STORAGE_KEY = "workImmersionDay10Data";
const form = document.getElementById("dailyActivityForm");
const imageInput = document.getElementById("activityPicture");
const imagePreview = document.getElementById("imagePreview");
const { jsPDF } = window.jspdf;

// Image preview
imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    imagePreview.src = e.target.result;
    imagePreview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

// Clear
document.getElementById("clearBtn").addEventListener("click", () => {
  form.reset();
  imagePreview.style.display = "none";
});

// PDF
document.getElementById("pdfBtn").addEventListener("click", () => {
  if (!form.checkValidity()) {
    alert("Please complete all required fields.");
    form.reportValidity();
    return;
  }

  const pdf = new jsPDF();
  let y = 40;

  const logo = new Image();
  logo.src = "logoacademyremove.png";

  logo.onload = () => {
    pdf.addImage(logo, "PNG", 85, 10, 40, 20);
    pdf.setFontSize(14);
    pdf.text("Daily Activity Report - Day 10", 105, 35, { align: "center" });
    pdf.setFontSize(11);

    const add = t => { pdf.text(t, 10, y); y += 8; };

    add(`Student: ${form.student.value}`);
    add(`Strand: ${form.strand.value}`);
    add(`Establishment: ${form.establishment.value}`);
    add(`Address: ${form.address.value}`);
    add(`Department: ${form.department.value}`);
    add(`Supervisor: ${form.supervisor.value}`);
    y += 5;

    add(`Date: ${form.date.value}`);
    add(`Time: ${form.time.value}`);
    y += 5;

    add("Activities:");
    add(`- ${form.activity1.value}`);
    add(`- ${form.activity2.value}`);
    y += 5;

    pdf.text("Supervisor Feedback:", 10, y);
    y += 6;
    pdf.text(form.feedback.value, 10, y, { maxWidth: 180 });
    y += 20;

    pdf.text("Reflection:", 10, y);
    y += 6;
    pdf.text(form.reflection.value, 10, y, { maxWidth: 180 });

    if (imagePreview.src) {
      pdf.addPage();
      pdf.text("Activity Picture:", 10, 10);
      pdf.addImage(imagePreview.src, "JPEG", 10, 20, 180, 120);
    }

    const filename = form.student.value.trim().replace(/\s+/g, "_");
    pdf.save(`${filename}_Day_10_Work_Immersion_Report.pdf`);
  };
});
</script>

</body>
</html>
