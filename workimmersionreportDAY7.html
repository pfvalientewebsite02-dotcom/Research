<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Work Immersion Report - Day 1</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    background-color: #0e960e;
    color: white;
    width: 100%;
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
  }

  header h1 {
    font-size: 1.8em;
    margin: 0;
  }

  .logo {
    width: 150px;
    height: auto;
  }

  section {
    width: 90%;
    max-width: 1000px;
    background-color: #fff8b0;
    padding: 20px;
    margin: 20px 0;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    box-sizing: border-box;
  }

  h2 {
    text-align: center;
    color: #317d2e;
    font-style: italic;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
  }

  th, td {
    border: 1px solid #333;
    padding: 8px;
    text-align: left;
  }

  textarea, input[type="date"], input[type="time"] {
    width: 100%;
    box-sizing: border-box;
    margin-top: 5px;
    margin-bottom: 10px;
    padding: 5px;
    border-radius: 4px;
    border: 1px solid #333;
  }

  #imagePreview {
    max-width: 400px;
    max-height: 300px;
    display: none;
    margin: 10px auto;
    border: 2px solid #333;
    border-radius: 8px;
    background-color: white;
  }

  .buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
  }

  button {
    padding: 10px 20px;
    font-weight: bold;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    color: white;
  }

  .next-btn {
    background-color: #0e960e;
  }

  .next-btn:hover {
    background-color: #0b7a0b;
  }

  .clear-btn {
    background-color: #b33a3a;
  }

  .clear-btn:hover {
    background-color: #8c2e2e;
  }

  footer {
    background-color: #e4e70d;
    color: white;
    text-align: center;
    padding: 15px;
    width: 100%;
    box-sizing: border-box;
    margin-top: auto;
  }
</style>
</head>
<body>

<header>
  <h1>Tayabas Western Academy</h1>
  <img src="logoacademyremove.png" alt="Academy Logo" class="logo">
</header>

<section>
  <h2>Activity 3: Daily Activity Report - Day 7</h2>

  <form id="dailyActivityForm" novalidate>
    <table>
      <tr>
        <th>Student-Trainee</th>
        <td><textarea name="student" rows="2" required></textarea></td>
      </tr>
      <tr>
        <th>Strand</th>
        <td><textarea name="strand" rows="2" required></textarea></td>
      </tr>
      <tr>
        <th>Establishment Name</th>
        <td><textarea name="establishment" rows="2" required></textarea></td>
      </tr>
      <tr>
        <th>Address</th>
        <td><textarea name="address" rows="2" required></textarea></td>
      </tr>
      <tr>
        <th>Department Assigned</th>
        <td><textarea name="department" rows="2" required></textarea></td>
      </tr>
      <tr>
        <th>Area Head / Supervisor</th>
        <td><textarea name="supervisor" rows="2" required></textarea></td>
      </tr>
    </table>

    <label for="date"><strong>Date:</strong></label>
    <input type="date" name="date" id="date" required><br>

    <label for="time"><strong>Time:</strong></label>
    <input type="time" name="time" id="time" required><br>

    <label><strong>Activities Done:</strong></label>
    <textarea name="activity1" rows="2" placeholder="Activity" required></textarea>
    <textarea name="activity2" rows="2" placeholder="Activity" required></textarea>

    <label><strong>Area Head / Supervisor Feedback:</strong></label>
    <textarea name="feedback" rows="5" placeholder="Feedback" required></textarea>

    <label><strong>Attach Activity Picture:</strong></label>
    <input type="file" name="activityPicture" id="activityPicture" accept="image/*">
    <img id="imagePreview" alt="Activity Preview">

    <label><strong>Student-Trainee Reflections:</strong></label>
    <textarea name="reflection" rows="5" placeholder="Reflections" required></textarea>

    <div class="buttons">
      <button type="button" class="clear-btn" id="clearBtn">Clear Form</button>
      <button type="button" class="next-btn" id="nextBtn">Next</button>
    </div>
  </form>
</section>

<footer>
  © 2025 Tayabas Western Academy | SENIOR HIGH WORK IMMERSION PROGRAM
</footer>

<script>
const STORAGE_KEY = "workImmersionDay1Data";

const form = document.getElementById("dailyActivityForm");
const imageInput = document.getElementById("activityPicture");
const imagePreview = document.getElementById("imagePreview");

// Load saved data
window.addEventListener("load", () => {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  for (const key in saved) {
    if (key === "activityPicture") continue; // cannot save file
    const el = form.elements[key];
    if (el) el.value = saved[key];
  }
});

// Auto-save text fields
form.addEventListener("input", (e) => {
  if (e.target.name !== "activityPicture") {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    data[e.target.name] = e.target.value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }
});

// Image preview
imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      imagePreview.src = e.target.result;
      imagePreview.style.display = "block";
    };
    reader.readAsDataURL(file);
    data.activityPictureName = file.name;
  } else {
    imagePreview.src = "";
    imagePreview.style.display = "none";
    delete data.activityPictureName;
  }

  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
});

// Clear form
document.getElementById("clearBtn").addEventListener("click", () => {
  form.reset();
  imagePreview.src = "";
  imagePreview.style.display = "none";
  localStorage.removeItem(STORAGE_KEY);
});

// Next button
document.getElementById("nextBtn").addEventListener("click", () => {
  if (!form.checkValidity()) {
    alert("Please fill in all required fields before proceeding.");
    form.reportValidity();
    return;
  }
  window.location.href = "workimmersionreportDAY8.html";
});
</script>

</body>
</html>
